# RF-DETR Detection + Instance Segmentation configuration schema

params:
  - key: auto_start
    label: Auto Start
    type: boolean
    default: false
    description: "Start this skill automatically when Hawkeye launches"

  - key: task_mode
    label: Output Mode
    type: select
    default: both
    description: "Detection emits boxes; segmentation emits masks and boxes; both uses RF-DETR-Seg for both"
    options:
      - { value: both, label: "Detection + Segmentation" }
      - { value: segmentation, label: "Segmentation Only" }
      - { value: detection, label: "Object Detection Only" }

  - key: model_size
    label: Detection Model Size
    type: select
    default: nano
    description: "RF-DETR detector variant for detection-only mode"
    options:
      - { value: nano, label: "Nano (384px, fastest)" }
      - { value: small, label: "Small (512px)" }
      - { value: medium, label: "Medium (576px)" }
      - { value: large, label: "Large (704px)" }
      - { value: base, label: "Base" }
      - { value: base2, label: "Base 2" }

  - key: seg_model_size
    label: Segmentation Model Size
    type: select
    default: nano
    description: "RF-DETR-Seg variant used for segmentation and combined mode"
    options:
      - { value: nano, label: "Seg Nano (312px, fastest)" }
      - { value: small, label: "Seg Small (384px)" }
      - { value: medium, label: "Seg Medium (432px)" }
      - { value: large, label: "Seg Large (504px)" }
      - { value: xlarge, label: "Seg XLarge (624px)" }
      - { value: xxlarge, label: "Seg 2XLarge (768px, most accurate)" }
      - { value: preview, label: "Seg Preview" }
      - { value: segmentation, label: "Segmentation Alias" }

  - key: custom_model_id
    label: Custom HF Model ID
    type: string
    default: ""
    placeholder: "Roboflow/rf-detr-seg-medium"
    description: "Optional Hugging Face model id; overrides model size"

  - key: confidence
    label: Confidence Threshold
    type: number
    default: 0.55
    min: 0.05
    max: 1.0
    description: "Minimum object confidence"

  - key: mask_threshold
    label: Mask Threshold
    type: number
    default: 0.50
    min: 0.05
    max: 1.0
    description: "Mask binarization threshold for instance segmentation"

  - key: classes
    label: Detection Classes
    type: string
    default: "person,car,dog,cat"
    description: "Comma-separated COCO class names; leave empty to emit all classes"

  - key: fps
    label: Frame Rate
    type: select
    default: 3
    description: "Processing rate; RF-DETR-Seg is heavier than YOLO, so 1-3 FPS is a practical default"
    options:
      - { value: 0.2, label: "Ultra Low (0.2 FPS)" }
      - { value: 0.5, label: "Low (0.5 FPS)" }
      - { value: 1, label: "Normal (1 FPS)" }
      - { value: 3, label: "Active (3 FPS)" }
      - { value: 5, label: "High (5 FPS)" }

  - key: device
    label: Inference Device
    type: select
    default: auto
    description: "Compute backend for PyTorch inference"
    options:
      - { value: auto, label: "Auto-detect" }
      - { value: cpu, label: "CPU" }
      - { value: cuda, label: "NVIDIA CUDA" }
      - { value: mps, label: "Apple Silicon (MPS)" }

  - key: half_precision
    label: CUDA Half Precision
    type: boolean
    default: true
    description: "Use fp16 on CUDA for better throughput and lower memory use"

  - key: torch_compile
    label: Torch Compile
    type: boolean
    default: false
    description: "Optional CUDA graph/compiler optimization; increases startup time"

  - key: enable_motion_gating
    label: Enable Motion Gating
    type: boolean
    default: true
    description: "Skip RF-DETR on static frames using CPU frame differencing"

  - key: motion_threshold
    label: Motion Threshold
    type: number
    default: 15
    min: 1
    max: 255
    description: "Pixel intensity change threshold for motion"

  - key: min_motion_area
    label: Min Motion Area
    type: number
    default: 500
    min: 10
    max: 50000
    description: "Minimum contour area to classify as motion"
